; Nobody Home - AtomS3R firmware
; pioarduino platform = arduino-esp32 3.x (the stock PlatformIO platform is still on 2.x)

[env:atoms3r]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 921600
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
; PSRAM left off for now: phase 1-4 do not need it, and a wrong PSRAM mode
; setting is a boot loop. Turn on when the screen/diary needs it.
lib_deps =
  m5stack/M5Unified@^0.2.5
